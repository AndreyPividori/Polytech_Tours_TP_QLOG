name: CI - Tests automatisés

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: sqlite:///./padel_corpo.db
      SECRET_KEY: ci-test-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      ALLOWED_ORIGINS: http://localhost:5173
      UPLOAD_DIR: ./uploads
      MAX_UPLOAD_SIZE: 2097152
      VITE_API_BASE_URL: http://localhost:8000/api/v1

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Initialiser la base SQLite de test
        working-directory: backend
        run: python seed.py

      - name: Démarrer FastAPI
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &

      - name: Installer les dépendances frontend
        working-directory: frontend
        run: npm ci

      - name: Démarrer Vite
        working-directory: frontend
        run: |
          nohup npm run dev -- --host 127.0.0.1 > vite.log 2>&1 &

      - name: Attendre FastAPI et Vite
        run: |
          for url in \
            http://localhost:8000/api/v1/health \
            http://localhost:5173; do
            curl --fail --retry 30 --retry-delay 2 --retry-all-errors "$url"
          done

      - name: Exécuter Cypress en mode headless
        working-directory: frontend
        run: npx cypress run

      - name: Publier les captures et vidéos Cypress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            frontend/cypress/screenshots/
            frontend/cypress/videos/
          if-no-files-found: ignore
