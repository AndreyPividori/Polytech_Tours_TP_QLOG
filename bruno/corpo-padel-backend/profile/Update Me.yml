info:
  name: Update Me
  type: http
  seq: 2
  tags:
    - profile

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/profile/me"
  body:
    type: json
    data: |-
      {
        "first_name": "",
        "last_name": "",
        "email": "",
        "birth_date": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/profile/me"
      method: PUT
      body:
        type: json
        data: |-
          {
            "first_name": "",
            "last_name": "",
            "email": "",
            "birth_date": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/api/v1/profile/me"
      method: PUT
      body:
        type: json
        data: |-
          {
            "first_name": "",
            "last_name": "",
            "email": "",
            "birth_date": ""
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": ""
              }
            ]
          }
