info:
  name: List Matches
  type: http
  seq: 1
  tags:
    - matches

http:
  method: GET
  url: "{{baseUrl}}/api/v1/matches"
  params:
    - name: upcoming
      value: "false"
      type: query
    - name: team_id
      value: ""
      type: query
      disabled: true
    - name: status
      value: ""
      type: query
      disabled: true
    - name: my_matches
      value: "false"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/matches"
      method: GET
      params:
        - name: upcoming
          value: "false"
          type: query
        - name: team_id
          value: ""
          type: query
          disabled: true
        - name: status
          value: ""
          type: query
          disabled: true
        - name: my_matches
          value: "false"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/api/v1/matches"
      method: GET
      params:
        - name: upcoming
          value: "false"
          type: query
        - name: team_id
          value: ""
          type: query
          disabled: true
        - name: status
          value: ""
          type: query
          disabled: true
        - name: my_matches
          value: "false"
          type: query
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": ""
              }
            ]
          }
