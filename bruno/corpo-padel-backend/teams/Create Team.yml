info:
  name: Create Team
  type: http
  seq: 2
  tags:
    - teams

http:
  method: POST
  url: "{{baseUrl}}/api/v1/teams"
  body:
    type: json
    data: |-
      {
        "company": "",
        "player1_id": 0,
        "player2_id": 0,
        "pool_id": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 201 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/teams"
      method: POST
      body:
        type: json
        data: |-
          {
            "company": "",
            "player1_id": 0,
            "player2_id": 0,
            "pool_id": ""
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/api/v1/teams"
      method: POST
      body:
        type: json
        data: |-
          {
            "company": "",
            "player1_id": 0,
            "player2_id": 0,
            "pool_id": ""
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": ""
              }
            ]
          }
