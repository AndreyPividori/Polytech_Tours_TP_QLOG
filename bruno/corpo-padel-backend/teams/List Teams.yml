info:
  name: List Teams
  type: http
  seq: 1
  tags:
    - teams

http:
  method: GET
  url: "{{baseUrl}}/api/v1/teams"
  params:
    - name: pool_id
      value: ""
      type: query
      disabled: true
    - name: company
      value: ""
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
