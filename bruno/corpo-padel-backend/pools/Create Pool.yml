info:
  name: Create Pool
  type: http
  seq: 2
  tags:
    - pools

http:
  method: POST
  url: "{{baseUrl}}/api/v1/pools"
  body:
    type: json
    data: |-
      {
        "name": "",
        "team_ids": []
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 201 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/pools"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "",
            "team_ids": []
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/api/v1/pools"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "",
            "team_ids": []
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": ""
              }
            ]
          }
