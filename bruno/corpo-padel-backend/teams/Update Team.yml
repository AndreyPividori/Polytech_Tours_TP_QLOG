info:
  name: Update Team
  type: http
  seq: 3
  tags:
    - teams

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/teams/:team_id"
  params:
    - name: team_id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "company": "",
        "player1_id": 0,
        "player2_id": 0,
        "pool_id": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/teams/:team_id"
      method: PUT
      params:
        - name: team_id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "company": "",
            "player1_id": 0,
            "player2_id": 0,
            "pool_id": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/api/v1/teams/:team_id"
      method: PUT
      params:
        - name: team_id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "company": "",
            "player1_id": 0,
            "player2_id": 0,
            "pool_id": ""
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": ""
              }
            ]
          }
