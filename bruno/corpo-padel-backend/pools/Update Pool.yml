info:
  name: Update Pool
  type: http
  seq: 3
  tags:
    - pools

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/pools/:pool_id"
  params:
    - name: pool_id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "name": "",
        "team_ids": []
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/pools/:pool_id"
      method: PUT
      params:
        - name: pool_id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "name": "",
            "team_ids": []
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/api/v1/pools/:pool_id"
      method: PUT
      params:
        - name: pool_id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "name": "",
            "team_ids": []
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": ""
              }
            ]
          }
